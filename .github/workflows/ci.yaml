name: CI

on:
  merge_group:
  push:
    # We need to explicitly include tags because otherwise when adding
    # `branches-ignore` it will only trigger on branches.
    tags:
      - '*'
    branches-ignore:
      # Ignore pushes to merge queues.
      # These refs are validated through the `merge_group` event, so the push
      # workflow only needs to reason about the resulting base-branch or tag
      # ref.
      - 'gh-readonly-queue/**'
      - 'dependabot/**'
  workflow_dispatch:

env:
  # Please make sure this version is included in the `matrix`, as the
  # `matrix` section can't use `env`, so it must be entered manually
  DEFAULT_PYTHON_VERSION: '3.11'
  # It would be nice to be able to also define a DEFAULT_UBUNTU_VERSION
  # but sadly `env` can't be used either in `runs-on`.

jobs:
  determine_ci_scope:
    name: Determine CI scope
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    outputs:
      has_prior_validation: ${{ steps.scope.outputs.has_prior_validation }}
      run_nox: ${{ steps.scope.outputs.run_nox }}
      run_build: ${{ steps.scope.outputs.run_build }}
      run_test_docs: ${{ steps.scope.outputs.run_test_docs }}
    steps:
      - name: Decide which checks this ref still needs
        id: scope
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu

          has_prior_validation=false
          run_nox=true
          run_build=true
          run_test_docs=true

          if [ "$EVENT_NAME" = "push" ]; then
            is_default_branch_push=false
            is_tag_push=false
            run_test_docs=false

            if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
              is_default_branch_push=true
            fi

            if [ "$REF_TYPE" = "tag" ]; then
              is_tag_push=true
            fi

            if [ "$is_default_branch_push" = "true" ] || \
               [ "$is_tag_push" = "true" ]; then
              merge_group_success=false
              if ! merge_group_success=$(gh api \
                -X GET \
                "/repos/$REPO/actions/workflows/ci.yaml/runs" \
                -f head_sha="$SHA" \
                -f event=merge_group \
                -f status=success \
                -f per_page=1 \
                --jq '.total_count > 0'); then
                echo "Unable to query prior merge_group runs, falling back to full CI" >&2
                merge_group_success=false
              fi

              default_branch_push_success=false
              if ! default_branch_push_success=$(gh api \
                -X GET \
                "/repos/$REPO/actions/workflows/ci.yaml/runs" \
                -f head_sha="$SHA" \
                -f event=push \
                -f branch="$DEFAULT_BRANCH" \
                -f status=success \
                -f per_page=1 \
                --jq '.total_count > 0'); then
                echo "Unable to query prior default-branch push runs, falling back to full CI" >&2
                default_branch_push_success=false
              fi

              if [ "$merge_group_success" = "true" ] || \
                 [ "$default_branch_push_success" = "true" ]; then
                has_prior_validation=true
              fi
            fi

            if [ "$is_default_branch_push" = "true" ] && \
               [ "$has_prior_validation" = "true" ]; then
              run_nox=false
              run_build=false
              run_test_docs=false
            elif [ "$is_default_branch_push" = "true" ]; then
              run_test_docs=true
            fi

            if [ "$is_tag_push" = "true" ] && \
               [ "$has_prior_validation" = "true" ]; then
              run_nox=false
              # Tags affect the setuptools_scm version, so release artifacts
              # must still be built and installation-tested from the tag itself.
              run_build=true
              run_test_docs=false
            elif [ "$is_tag_push" = "true" ]; then
              run_test_docs=true
            fi
          fi

          {
            echo "has_prior_validation=$has_prior_validation"
            echo "run_nox=$run_nox"
            echo "run_build=$run_build"
            echo "run_test_docs=$run_test_docs"
          } >> "$GITHUB_OUTPUT"

  nox:
    name: Test with nox
    needs: ["determine_ci_scope"]
    if: needs.determine_ci_scope.outputs.run_nox == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        python:
          - "3.11"
          - "3.12"
        nox-session:
          # To speed things up a bit we use the special ci_checks_max session
          # that uses the same venv to run multiple linting sessions
          - "ci_checks_max"
          - "pytest_min"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Run nox
        uses: frequenz-floss/gh-action-nox@v1.1.0
        with:
          python-version: ${{ matrix.python }}
          nox-session: ${{ matrix.nox-session }}

  # This job runs if all the `nox` matrix jobs ran and succeeded, or if the
  # workflow intentionally skipped `nox` because this exact SHA was already
  # validated earlier.
  nox-all:
    # The job name should match the name of the `nox` job.
    name: Test with nox
    needs: ["determine_ci_scope", "nox"]
    if: >
      always() &&
      needs.determine_ci_scope.result == 'success' &&
      needs.nox.result != 'failure' &&
      needs.nox.result != 'cancelled'
    runs-on: ubuntu-slim
    steps:
      - name: Check matrix job result
        env:
          RESULT: ${{ needs.nox.result }}
        run: test "$RESULT" = "success" || test "$RESULT" = "skipped"

  build:
    name: Build distribution packages
    needs: ["determine_ci_scope"]
    if: needs.determine_ci_scope.outputs.run_build == 'true'
    # Since this is a pure Python package, we only need to build it once. If it
    # had any architecture specific code, we would need to build it for each
    # architecture.
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Git
        uses: frequenz-floss/gh-action-setup-git@v1.0.0

      - name: Fetch sources
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Python
        uses: frequenz-floss/gh-action-setup-python-with-deps@v1.0.2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          dependencies: build

      - name: Build the source and binary distribution
        run: python -m build

      - name: Upload distribution files
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          if-no-files-found: error

  test-installation:
    name: Test package installation
    needs: ["determine_ci_scope", "build"]
    if: needs.determine_ci_scope.outputs.run_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        python:
          - "3.11"
          - "3.12"
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Setup Git
        uses: frequenz-floss/gh-action-setup-git@v1.0.0

      - name: Print environment (debug)
        run: env

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist

      # This is necessary for the `pip` caching in the setup-python action to work
      - name: Fetch the pyproject.toml file for this action hash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          set -ux
          gh api \
              -X GET \
              -H "Accept: application/vnd.github.raw" \
              "/repos/$REPO/contents/pyproject.toml?ref=$REF" \
            > pyproject.toml

      - name: Setup Python
        uses: frequenz-floss/gh-action-setup-python-with-deps@v1.0.2
        with:
          python-version: ${{ matrix.python }}
          dependencies: dist/*.whl

      - name: Print installed packages (debug)
        run: python -m pip freeze

  # This job runs if all the `test-installation` matrix jobs ran and succeeded,
  # or if the workflow intentionally skipped them because this exact SHA was
  # already validated earlier.
  test-installation-all:
    # The job name should match the name of the `test-installation` job.
    name: Test package installation
    needs: ["determine_ci_scope", "test-installation"]
    if: >
      always() &&
      needs.determine_ci_scope.result == 'success' &&
      needs['test-installation'].result != 'failure' &&
      needs['test-installation'].result != 'cancelled'
    runs-on: ubuntu-slim
    steps:
      - name: Check matrix job result
        env:
          RESULT: ${{ needs['test-installation'].result }}
        run: test "$RESULT" = "success" || test "$RESULT" = "skipped"

  test-docs:
    name: Test documentation website generation
    needs: ["determine_ci_scope"]
    if: needs.determine_ci_scope.outputs.run_test_docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Git
        uses: frequenz-floss/gh-action-setup-git@v1.0.0

      - name: Fetch sources
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Python
        uses: frequenz-floss/gh-action-setup-python-with-deps@v1.0.2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          dependencies: .[dev-mkdocs]

      - name: Generate the documentation
        env:
          MIKE_VERSION: gh-${{ github.job }}
        run: |
          mike deploy $MIKE_VERSION
          mike set-default $MIKE_VERSION

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  publish-docs:
    name: Publish documentation website to GitHub pages
    needs: ["determine_ci_scope", "nox-all", "test-installation-all", "test-docs"]
    if: >
      github.event_name == 'push' &&
      always() &&
      needs.determine_ci_scope.result == 'success' &&
      needs['nox-all'].result == 'success' &&
      needs['test-installation-all'].result == 'success' &&
      (needs['test-docs'].result == 'success' || needs['test-docs'].result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Setup Git
        uses: frequenz-floss/gh-action-setup-git@v1.0.0

      - name: Fetch sources
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Python
        uses: frequenz-floss/gh-action-setup-python-with-deps@v1.0.2
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          dependencies: .[dev-mkdocs]

      - name: Calculate and check version
        id: mike-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python -m frequenz.repo.config.cli.version.mike.info

      - name: Fetch the gh-pages branch
        if: steps.mike-version.outputs.version
        run: git fetch origin gh-pages --depth=1

      - name: Build site
        if: steps.mike-version.outputs.version
        env:
          VERSION: ${{ steps.mike-version.outputs.version }}
          TITLE: ${{ steps.mike-version.outputs.title }}
          ALIASES: ${{ steps.mike-version.outputs.aliases }}
          # This is not ideal, we need to define all these variables here
          # because we need to calculate all the repository version information
          # to be able to show the correct versions in the documentation when
          # building it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          mike deploy --update-aliases --title "$TITLE" "$VERSION" $ALIASES

      - name: Sort site versions
        if: steps.mike-version.outputs.version
        run: |
          git checkout gh-pages
          python -m frequenz.repo.config.cli.version.mike.sort versions.json
          git commit -a -m "Sort versions.json"

      - name: Publish site
        if: steps.mike-version.outputs.version
        run: |
          git push origin gh-pages

  create-github-release:
    name: Create GitHub release
    needs: ["publish-docs"]
    # Create a release only on tags creation
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      # We need write permissions on contents to create GitHub releases and on
      # discussions to create the release announcement in the discussion forums
      contents: write
      discussions: write
    runs-on: ubuntu-slim
    steps:
      - name: Download distribution files
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist

      - name: Download RELEASE_NOTES.md
        run: |
          set -ux
          gh api \
              -X GET \
              -f ref=$REF \
              -H "Accept: application/vnd.github.raw" \
              "/repos/$REPOSITORY/contents/RELEASE_NOTES.md" \
            > RELEASE_NOTES.md
        env:
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        run: |
          set -ux
          extra_opts=
          if echo "$REF_NAME" | grep -- -; then extra_opts=" --prerelease"; fi
          gh release create \
            -R "$REPOSITORY" \
            --notes-file RELEASE_NOTES.md \
            --generate-notes \
            $extra_opts \
            $REF_NAME \
            dist/*
        env:
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-pypi:
    name: Publish packages to PyPI
    needs: ["create-github-release"]
    runs-on: ubuntu-24.04
    permissions:
      # For trusted publishing. See:
      # https://blog.pypi.org/posts/2023-04-20-introducing-trusted-publishers/
      id-token: write
    steps:
      - name: Download distribution files
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist

      - name: Publish the Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
